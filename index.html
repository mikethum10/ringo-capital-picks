<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ringo Capital | WNBA Picks</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .driver-bar-pos { background: #16a34a; }
    .driver-bar-neg { background: #dc2626; }
    .tier-STRONG  { background:#15803d; color:#fff; }
    .tier-MEDIUM  { background:#1d4ed8; color:#fff; }
    .tier-LEAN    { background:#b45309; color:#fff; }
    .tier-NO-SPREAD,.tier-default { background:#6b7280; color:#fff; }
    .ats-W { color:#16a34a; font-weight:700; }
    .ats-L { color:#dc2626; font-weight:700; }
    .ats-P { color:#6b7280; font-weight:700; }
    details > summary { cursor: pointer; list-style: none; }
    details > summary::-webkit-details-marker { display: none; }
    details[open] .chevron { transform: rotate(180deg); }
    .chevron { transition: transform 0.2s; display:inline-block; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen font-sans">

<!-- HEADER -->
<header class="bg-white border-b border-slate-200 sticky top-0 z-10 shadow-sm">
  <div class="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between">
    <div>
      <span class="text-xl font-bold tracking-tight text-slate-900">Ringo Capital</span>
      <span class="ml-2 text-sm text-slate-400">WNBA 2026 Model</span>
    </div>
    <div id="header-record" class="text-right text-sm text-slate-500">Loading…</div>
  </div>
</header>

<main class="max-w-4xl mx-auto px-4 py-6 space-y-8">

  <!-- DATE + SUMMARY -->
  <div class="flex items-baseline justify-between">
    <h1 id="picks-date" class="text-2xl font-bold text-slate-900">—</h1>
    <p id="model-note" class="text-xs text-slate-400"></p>
  </div>

  <!-- BET CARDS -->
  <section>
    <h2 class="text-sm font-semibold uppercase tracking-wide text-slate-400 mb-3">Today's Picks</h2>
    <div id="bet-cards" class="space-y-4"></div>
    <p id="no-bets" class="hidden text-slate-400 text-sm italic">No plays meet the edge threshold today.</p>
  </section>

  <!-- ALL GAMES -->
  <section>
    <h2 class="text-sm font-semibold uppercase tracking-wide text-slate-400 mb-3">All Games</h2>
    <div id="all-games" class="space-y-3"></div>
  </section>

  <!-- SEASON RECORD -->
  <section>
    <h2 class="text-sm font-semibold uppercase tracking-wide text-slate-400 mb-3">Season Record</h2>
    <div id="season-summary" class="grid grid-cols-2 sm:grid-cols-4 gap-3 mb-4"></div>
    <div id="results-table-wrap" class="overflow-x-auto rounded-xl border border-slate-200 bg-white">
      <table class="w-full text-sm">
        <thead>
          <tr class="border-b border-slate-100 text-slate-400 text-xs uppercase">
            <th class="px-4 py-2 text-left">Date</th>
            <th class="px-4 py-2 text-left">Matchup</th>
            <th class="px-4 py-2 text-left">Bet</th>
            <th class="px-4 py-2 text-right">Line</th>
            <th class="px-4 py-2 text-right">Model</th>
            <th class="px-4 py-2 text-right">Edge</th>
            <th class="px-4 py-2 text-center">Tier</th>
            <th class="px-4 py-2 text-right">Actual</th>
            <th class="px-4 py-2 text-center">ATS</th>
          </tr>
        </thead>
        <tbody id="results-body"></tbody>
      </table>
      <p id="no-results" class="hidden text-center text-slate-400 text-sm py-6 italic">No results yet this season.</p>
    </div>
  </section>

</main>

<footer class="text-center text-xs text-slate-300 py-6">
  Model: Ridge+XGBoost ensemble · 55.6% ATS backtest (2022–2025) · Break-even 52.4%
</footer>

<script>
const TIER_ORDER = { STRONG: 0, MEDIUM: 1, LEAN: 2 };

function tierBadge(tier) {
  return `<span class="tier-${tier.replace(/\s/g,'-')} px-2 py-0.5 rounded text-xs font-bold uppercase">${tier}</span>`;
}

function signStr(v, decimals=1) {
  if (v == null) return 'N/A';
  return (v >= 0 ? '+' : '') + v.toFixed(decimals);
}

function edgeSideIcon(side) {
  if (side == null) return '';
  if (side === 'EVEN') return '<span class="text-slate-300">—</span>';
  return `<span class="font-medium text-slate-500">${side}</span>`;
}

function hasInjuries(g) {
  return (g.inj_home && g.inj_home.length > 0) || (g.inj_away && g.inj_away.length > 0);
}

function buildStatTable(stats, betDir) {
  if (!stats || !stats.length) return '<p class="text-slate-400 text-sm italic">No stats available.</p>';
  let html = `<table class="w-full text-sm mt-2">
    <thead><tr class="text-xs uppercase text-slate-400 border-b border-slate-100">
      <th class="py-1 text-left">Stat</th>
      <th class="py-1 text-right">Home</th>
      <th class="py-1 text-right">Away</th>
      <th class="py-1 text-right">Edge</th>
    </tr></thead><tbody>`;
  for (const s of stats) {
    const isBetEdge = s.edge_side === betDir;
    const rowCls = isBetEdge ? 'bg-green-50' : '';
    html += `<tr class="${rowCls} border-b border-slate-50">
      <td class="py-1 text-slate-600">${s.label}</td>
      <td class="py-1 text-right font-mono">${s.home_display}</td>
      <td class="py-1 text-right font-mono">${s.away_display}</td>
      <td class="py-1 text-right">${edgeSideIcon(s.edge_side)}</td>
    </tr>`;
  }
  html += '</tbody></table>';
  return html;
}

function modelBreakdown(g) {
  if (g.pred_ridge == null || g.pred_xgb == null) return '';
  const diff = Math.abs(g.pred_ridge - g.pred_xgb);
  const agree = diff < 4;
  const agreeColor = agree ? 'text-green-600' : 'text-amber-600';
  const agreeLabel = agree ? 'Models agree' : 'Models diverge';
  return `<div class="flex flex-wrap items-center gap-x-5 gap-y-1 pt-3 pb-3 border-b border-slate-100 text-sm">
    <span class="text-xs text-slate-400 font-semibold uppercase tracking-wide">Model Breakdown</span>
    <span><span class="text-xs text-slate-400 mr-1">Ridge</span><span class="font-mono">${signStr(g.pred_ridge)}</span></span>
    <span><span class="text-xs text-slate-400 mr-1">XGBoost</span><span class="font-mono">${signStr(g.pred_xgb)}</span></span>
    <span><span class="text-xs text-slate-400 mr-1">Ensemble</span><span class="font-mono font-semibold">${signStr(g.pred_margin)}</span></span>
    <span class="${agreeColor} text-xs ml-auto">${diff.toFixed(1)} pt spread &middot; ${agreeLabel}</span>
  </div>`;
}

function buildDriverList(drivers) {
  if (!drivers || !drivers.length) return '<p class="text-slate-400 text-sm italic">SHAP not available.</p>';
  const maxAbs = Math.max(...drivers.map(d => Math.abs(d.impact)));
  let html = '<div class="space-y-2 mt-2">';
  for (const d of drivers) {
    const pct = Math.round((Math.abs(d.impact) / maxAbs) * 100);
    const pos = d.impact >= 0;
    const barCls = pos ? 'driver-bar-pos' : 'driver-bar-neg';
    const sign = pos ? '+' : '';
    const dirLabel = pos ? 'home cover' : 'away cover';
    html += `<div>
      <div class="flex justify-between text-xs text-slate-500 mb-0.5">
        <span><strong>${d.side}</strong> ${d.label}</span>
        <span class="${pos ? 'text-green-600' : 'text-red-600'} font-mono">${sign}${d.impact.toFixed(2)} pts &rarr; ${dirLabel}</span>
      </div>
      <div class="bg-slate-100 rounded h-1.5 w-full">
        <div class="${barCls} h-1.5 rounded" style="width:${pct}%"></div>
      </div>
    </div>`;
  }
  html += '</div>';
  return html;
}

function buildInjurySection(g) {
  if (!hasInjuries(g)) return '';

  const allPlayers = [
    ...(g.inj_home || []).map(p => ({...p, side: 'HOME'})),
    ...(g.inj_away || []).map(p => ({...p, side: 'AWAY'})),
  ];

  const delta = g.inj_delta ?? 0;
  const hasDelta = delta !== 0;
  const favors = delta > 0 ? `HOME ${g.home_team}` : `AWAY ${g.away_team}`;
  const deltaStr = (delta >= 0 ? '+' : '') + delta.toFixed(1) + ' pts';

  const baseBetStr = ((g.bet_direction || '') + ' ' + (g.bet_team || '')).trim();
  const adjBetStr  = ((g.adj_bet_direction || '') + ' ' + (g.adj_bet_team || '')).trim();
  const isSideFlip   = g.has_bet && g.adj_has_bet && baseBetStr !== adjBetStr;
  const isBetAppear  = !g.has_bet && g.adj_has_bet;
  const isBetDisapp  = g.has_bet && !g.adj_has_bet;
  const isTierChange = g.has_bet && g.adj_has_bet && g.tier !== g.adj_tier && !isSideFlip;

  let rows = '';
  for (const p of allPlayers) {
    const impactStr = p.found
      ? `<span class="${p.impact >= 0 ? 'text-green-700' : 'text-red-700'} font-mono font-semibold">${(p.impact >= 0 ? '+' : '') + p.impact.toFixed(1)} pts${p.gtd ? ' (GTD&times;&frac12;)' : ''}</span>`
      : `<span class="text-slate-400 italic text-xs">no historical data${p.gtd ? ' (GTD)' : ''}</span>`;
    rows += `<tr class="border-b border-amber-100 last:border-0">
      <td class="py-1.5 pr-3 text-slate-700 text-sm">${p.player}</td>
      <td class="py-1.5 pr-3"><span class="${p.side === 'HOME' ? 'text-blue-600' : 'text-orange-600'} text-xs font-semibold">${p.side}</span></td>
      <td class="py-1.5 pr-3"><span class="${p.status === 'OUT' ? 'text-red-600' : 'text-amber-600'} text-xs font-bold">${p.status}</span></td>
      <td class="py-1.5 text-right text-xs">${impactStr}</td>
    </tr>`;
  }

  const flags = [
    (isSideFlip || isBetAppear) ? '<span class="bg-red-100 text-red-700 text-xs font-bold px-2 py-0.5 rounded">SIDE FLIP</span>' : '',
    isTierChange                ? '<span class="bg-amber-100 text-amber-700 text-xs font-bold px-2 py-0.5 rounded">TIER CHANGE</span>' : '',
    isBetDisapp                 ? '<span class="bg-slate-200 text-slate-600 text-xs font-bold px-2 py-0.5 rounded">BET REMOVED</span>' : '',
  ].filter(Boolean).join(' ');

  const adjLine = hasDelta ? `
    <div class="mt-2.5 pt-2.5 border-t border-amber-200 space-y-1">
      <div class="flex flex-wrap items-center gap-x-3 gap-y-1 text-xs text-slate-600">
        <span>Net injury delta: <span class="${delta >= 0 ? 'text-green-700' : 'text-red-700'} font-mono font-bold">${deltaStr}</span> &rarr; favors <strong>${favors}</strong></span>
      </div>
      <div class="flex flex-wrap items-center gap-x-3 gap-y-1 text-xs text-slate-600">
        <span>Base: <span class="font-mono">${signStr(g.pred_margin)}</span> (${g.tier || '&mdash;'})</span>
        <span class="text-slate-400">&rarr;</span>
        <span>Adjusted: <span class="font-mono font-bold">${signStr(g.adj_margin)}</span> (${g.adj_tier || '&mdash;'})</span>
        ${flags ? `<span class="ml-1">${flags}</span>` : ''}
      </div>
    </div>` : '';

  return `
  <div class="rounded-lg bg-amber-50 border border-amber-200 px-4 py-3 mt-3 mb-1">
    <div class="flex items-center gap-2 mb-2">
      <span class="text-xs font-bold uppercase tracking-wide text-amber-800">Injury Report</span>
      <span class="text-xs text-amber-400">&middot; Rotowire</span>
    </div>
    <table class="w-full"><tbody>${rows}</tbody></table>
    ${adjLine}
  </div>`;
}

function gameCard(g) {
  const inj = hasInjuries(g);

  // Use adjusted values when injuries are present
  const hasBet     = inj ? (g.adj_has_bet ?? g.has_bet)               : g.has_bet;
  const tier       = inj ? (g.adj_tier ?? g.tier)                     : g.tier;
  const betDir     = inj ? (g.adj_bet_direction ?? g.bet_direction)   : g.bet_direction;
  const betTeam    = inj ? (g.adj_bet_team ?? g.bet_team)             : g.bet_team;
  const dispMargin = inj ? (g.adj_margin ?? g.pred_margin)            : g.pred_margin;
  const dispEdge   = inj ? (g.adj_edge ?? g.edge)                     : g.edge;

  const spread  = g.spread != null ? (g.spread >= 0 ? '+' : '') + g.spread.toFixed(1) : 'N/A';
  const edgeStr = dispEdge != null ? (dispEdge >= 0 ? '+' : '') + dispEdge.toFixed(2) : 'N/A';
  const pred    = signStr(dispMargin);
  const betLabel = hasBet ? `${betDir} ${betTeam}` : '—';

  const baseBetStr = ((g.bet_direction || '') + ' ' + (g.bet_team || '')).trim();
  const adjBetStr  = ((g.adj_bet_direction || '') + ' ' + (g.adj_bet_team || '')).trim();
  const isSideFlip  = inj && g.has_bet && g.adj_has_bet && baseBetStr !== adjBetStr;
  const isBetAppear = inj && !g.has_bet && g.adj_has_bet;

  const borderCls = hasBet
    ? (tier === 'STRONG' ? 'border-l-4 border-green-500' : tier === 'MEDIUM' ? 'border-l-4 border-blue-500' : 'border-l-4 border-amber-500')
    : 'border-l-4 border-slate-200';

  const resultBadge = g.ats_result
    ? `<span class="ats-${g.ats_result} ml-2">${g.ats_result}</span>`
    : (g.actual_margin != null ? `<span class="text-slate-400 text-xs ml-2">Final: ${signStr(g.actual_margin)}</span>` : '');

  const flipHeaderBadge = (isSideFlip || isBetAppear)
    ? `<span class="bg-red-100 text-red-700 text-xs font-bold px-1.5 py-0.5 rounded">SIDE FLIP</span>`
    : '';

  const injDeltaBadge = inj && (g.inj_delta ?? 0) !== 0
    ? `<span class="text-xs text-amber-600 font-mono ml-1">${(g.inj_delta >= 0 ? '+' : '') + g.inj_delta.toFixed(1)} inj</span>`
    : '';

  return `
  <div class="bg-white rounded-xl shadow-sm ${borderCls} overflow-hidden">
    <details>
      <summary class="px-5 py-4 flex items-center justify-between hover:bg-slate-50 transition-colors">
        <div class="flex-1 min-w-0">
          <div class="flex items-center gap-2 flex-wrap">
            ${hasBet ? tierBadge(tier) : ''}
            ${flipHeaderBadge}
            <span class="font-semibold text-slate-900 truncate">${g.away_team} <span class="text-slate-400 font-normal">@</span> ${g.home_team}</span>
            ${resultBadge}
          </div>
          ${hasBet ? `<div class="text-xs text-slate-500 mt-1">Bet: <strong>${betLabel}</strong>${injDeltaBadge}</div>` : ''}
        </div>
        <div class="flex items-center gap-4 ml-4 shrink-0">
          <div class="text-right hidden sm:block">
            <div class="text-xs text-slate-400">Line / Model / Edge</div>
            <div class="font-mono text-sm text-slate-700">${spread} / ${pred} / <span class="${dispEdge != null && Math.abs(dispEdge) >= 2.5 ? 'text-green-600 font-bold' : ''}">${edgeStr}</span></div>
          </div>
          <span class="chevron text-slate-400 text-lg">&#8964;</span>
        </div>
      </summary>
      <div class="px-5 pb-5 border-t border-slate-100">
        <div class="sm:hidden mb-3 pt-3 grid grid-cols-3 text-center text-xs text-slate-500">
          <div><div class="font-semibold text-slate-700 text-base">${spread}</div>Line</div>
          <div><div class="font-semibold text-slate-700 text-base">${pred}</div>Model</div>
          <div><div class="font-semibold ${dispEdge != null && Math.abs(dispEdge) >= 2.5 ? 'text-green-600' : 'text-slate-700'} text-base">${edgeStr}</div>Edge</div>
        </div>
        ${modelBreakdown(g)}
        ${buildInjurySection(g)}
        <div class="grid md:grid-cols-2 gap-6 pt-3">
          <div>
            <h4 class="text-xs font-semibold uppercase tracking-wide text-slate-400 mb-1">Stat Comparison</h4>
            ${buildStatTable(g.stats, betDir)}
          </div>
          <div>
            <h4 class="text-xs font-semibold uppercase tracking-wide text-slate-400 mb-1">Model Drivers (SHAP)</h4>
            ${buildDriverList(g.shap_drivers)}
            <p class="text-xs text-slate-300 mt-2">+ = toward home cover &nbsp;&middot;&nbsp; - = toward away cover</p>
          </div>
        </div>
      </div>
    </details>
  </div>`;
}

function statCard(label, value, sub='') {
  return `<div class="bg-white rounded-xl shadow-sm px-4 py-3">
    <div class="text-xs text-slate-400 uppercase tracking-wide">${label}</div>
    <div class="text-2xl font-bold text-slate-900 mt-1">${value}</div>
    ${sub ? `<div class="text-xs text-slate-400 mt-0.5">${sub}</div>` : ''}
  </div>`;
}

async function loadJSON(path) {
  try {
    const r = await fetch(path + '?t=' + Date.now());
    if (!r.ok) return null;
    return await r.json();
  } catch { return null; }
}

async function render() {
  const [pred, results] = await Promise.all([
    loadJSON('data/latest.json'),
    loadJSON('data/results.json'),
  ]);

  // --- Season record header ---
  const rec = results?.record ?? { W: 0, L: 0, P: 0 };
  const total = (rec.W||0) + (rec.L||0) + (rec.P||0);
  const winPct = total > 0 ? ((rec.W||0) / ((rec.W||0)+(rec.L||0)) * 100).toFixed(1) : '—';
  const roi = results?.roi_units ?? 0;
  document.getElementById('header-record').innerHTML =
    `<span class="font-semibold text-slate-700">${rec.W||0}-${rec.L||0}-${rec.P||0}</span> &nbsp;&middot;&nbsp; ${winPct}% ATS &nbsp;&middot;&nbsp; <span class="${roi>=0?'text-green-600':'text-red-600'} font-semibold">${roi>=0?'+':''}${roi.toFixed(2)}u ROI</span>`;

  // --- Today's picks ---
  if (pred) {
    document.getElementById('picks-date').textContent = new Date(pred.date + 'T12:00:00').toLocaleDateString('en-US', { weekday:'long', month:'long', day:'numeric', year:'numeric' });
    document.getElementById('model-note').textContent = `Generated ${new Date(pred.generated_at).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit',timeZoneName:'short'})}`;

    // Resolve effective has_bet and tier accounting for injury adjustments
    const effHasBet = g => hasInjuries(g) ? (g.adj_has_bet ?? g.has_bet) : g.has_bet;
    const effTier   = g => hasInjuries(g) ? (g.adj_tier ?? g.tier)       : g.tier;

    const bets    = (pred.games||[]).filter(effHasBet).sort((a,b) => (TIER_ORDER[effTier(a)]??9) - (TIER_ORDER[effTier(b)]??9));
    const nonBets = (pred.games||[]).filter(g => !effHasBet(g));

    const betContainer = document.getElementById('bet-cards');
    if (bets.length) {
      betContainer.innerHTML = bets.map(g => gameCard(g)).join('');
    } else {
      document.getElementById('no-bets').classList.remove('hidden');
    }

    document.getElementById('all-games').innerHTML = nonBets.map(g => gameCard(g)).join('');
  } else {
    document.getElementById('picks-date').textContent = 'No predictions loaded';
  }

  // --- Season summary cards ---
  const byTier = results?.by_tier ?? {};
  const summaryEl = document.getElementById('season-summary');
  summaryEl.innerHTML =
    statCard('Overall', `${rec.W||0}-${rec.L||0}-${rec.P||0}`, `${winPct}% win rate`) +
    statCard('ROI', `${roi>=0?'+':''}${roi.toFixed(2)}u`, 'at -110 juice') +
    statCard('STRONG', byTier.STRONG ? `${byTier.STRONG.W}-${byTier.STRONG.L}-${byTier.STRONG.P||0}` : '0-0', 'bets') +
    statCard('MEDIUM', byTier.MEDIUM ? `${byTier.MEDIUM.W}-${byTier.MEDIUM.L}-${byTier.MEDIUM.P||0}` : '0-0', 'bets');

  // --- Results table ---
  const pastBets = results?.bets ?? [];
  const tbody = document.getElementById('results-body');
  if (pastBets.length === 0) {
    document.getElementById('no-results').classList.remove('hidden');
  } else {
    tbody.innerHTML = [...pastBets].reverse().map(b => {
      const spread = b.spread != null ? (b.spread>=0?'+':'')+b.spread.toFixed(1) : 'N/A';
      const edge   = b.edge   != null ? (b.edge  >=0?'+':'')+b.edge.toFixed(2)   : 'N/A';
      const actual = b.actual_margin != null ? signStr(b.actual_margin) : '—';
      const ats    = b.ats_result ? `<span class="ats-${b.ats_result}">${b.ats_result}</span>` : '—';
      return `<tr class="border-b border-slate-50 hover:bg-slate-50 transition-colors">
        <td class="px-4 py-2 text-slate-400 whitespace-nowrap">${b.date}</td>
        <td class="px-4 py-2 whitespace-nowrap">${b.away_team} @ ${b.home_team}</td>
        <td class="px-4 py-2 font-medium text-slate-700 whitespace-nowrap">${b.bet_direction} ${b.bet_team}</td>
        <td class="px-4 py-2 text-right font-mono">${spread}</td>
        <td class="px-4 py-2 text-right font-mono">${signStr(b.pred_margin)}</td>
        <td class="px-4 py-2 text-right font-mono">${edge}</td>
        <td class="px-4 py-2 text-center">${tierBadge(b.tier)}</td>
        <td class="px-4 py-2 text-right font-mono">${actual}</td>
        <td class="px-4 py-2 text-center">${ats}</td>
      </tr>`;
    }).join('');
  }
}

render();
</script>
</body>
</html>
